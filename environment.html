<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Spacemacship Environment</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>λ</text></svg>" />
    <style>
      :root {
        color-scheme: dark;
        /* White ink in five steps on black; orange only for what is changing right now, or waiting on you. */
        --bg: #000;
        --ink: #fff;
        --ink-2: rgb(255 255 255 / 0.64);
        --ink-3: rgb(255 255 255 / 0.4);
        --ink-4: rgb(255 255 255 / 0.22);
        --ink-5: rgb(255 255 255 / 0.1);
        --hot: #ff5a1f;
        --hot-wash: rgb(255 90 31 / 0.38);
        --hair: 1px;
        --text-size: 11px;
        --small-size: 9px;
        --line: 18px;
        --gap: 8px;
        --tray-height: 18px;
        background: var(--bg);
        color: var(--ink);
        font:
          var(--text-size) / var(--line) "JetBrains Mono Variable",
          monospace;
        -webkit-font-smoothing: antialiased;
      }
      body {
        margin: 0;
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
        color: inherit;
      }
      button,
      select {
        padding: 0 0.5ch;
        border: var(--hair) solid var(--ink-4);
        background: var(--bg);
        cursor: pointer;
        &:hover {
          border-color: var(--ink-2);
        }
        &:disabled {
          color: var(--ink-4);
          cursor: default;
        }
        &[aria-checked="true"],
        &[aria-pressed="true"] {
          border-color: var(--hot);
          color: var(--hot);
        }
      }
      input,
      textarea {
        padding: 0 0.5ch;
        border: var(--hair) solid var(--ink-4);
        background: transparent;
        outline: none;
        &:focus {
          border-color: var(--hot);
        }
      }
      ::selection {
        background: var(--hot-wash);
      }
      pre {
        margin: 0;
        font: inherit;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      p {
        margin: 0;
      }
      [hidden] {
        display: none !important;
      }
      body > div {
        display: grid;
        grid-template-columns: 24ch 1fr;
        height: calc(100dvh - var(--tray-height));
      }
      aside {
        display: flex;
        flex-direction: column;
        gap: var(--gap);
        padding: var(--gap);
        border-right: var(--hair) solid var(--ink-5);
        overflow-y: auto;

        h2 {
          margin: var(--gap) 0 0;
          font: inherit;
          color: var(--ink-3);
        }
        ul {
          margin: 0;
          padding: 0;
          list-style: none;
        }
        li {
          display: flex;
          justify-content: space-between;
          gap: 1ch;
          small {
            color: var(--ink-3);
            font-size: var(--small-size);
          }
        }
        #buffer-list button {
          padding: 0;
          border: none;
          text-align: start;
          color: var(--ink-3);
        }
        #buffer-list [data-open] button {
          color: var(--ink);
        }
        #buffer-list [data-running] button::after,
        #agent-list :is([data-status="thinking"], [data-status="running"], [data-status="waiting"]) b::after {
          content: " ●";
          color: var(--hot);
        }
        #agent-list li {
          display: block;
        }
        #tool-list li {
          display: block;
          color: var(--ink-3);
          font-size: var(--small-size);
          overflow-wrap: anywhere;
        }
        .actions {
          display: flex;
          gap: 4px;
        }
      }
      #panes {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(48ch, 1fr));
        grid-auto-rows: minmax(0, 1fr);
        min-height: 0;
        overflow: auto;
      }
      .pane {
        display: grid;
        grid-template-rows: auto minmax(4lh, 1fr) auto auto auto;
        grid-template-columns: minmax(0, 1fr);
        gap: 4px;
        min-width: 0;
        min-height: 0;
        padding: var(--gap);
        border-right: var(--hair) solid var(--ink-5);
        border-bottom: var(--hair) solid var(--ink-5);

        > header {
          display: flex;
          align-items: center;
          gap: var(--gap);
          span,
          small {
            color: var(--ink-3);
          }
          small {
            flex: 1;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
          }
        }
        &[data-running] > header small {
          color: var(--hot);
        }
        .text {
          min-height: 0;
          overflow-y: auto;
          color: var(--ink-2);
        }
        > textarea {
          field-sizing: content;
          max-height: 8lh;
          resize: none;
        }
        .agents,
        .requests {
          display: grid;
          gap: 4px;
          max-height: 50vh;
          overflow-y: auto;
        }
        .request > p {
          color: var(--ink-3);
        }
      }
      .agent {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        gap: 4px;
        padding: var(--gap);
        border: var(--hair) solid var(--ink-5);

        > header {
          display: flex;
          align-items: center;
          gap: var(--gap);
          .status {
            flex: 1;
            color: var(--ink-3);
          }
        }
        &:is([data-status="thinking"], [data-status="running"]) > header .status {
          color: var(--hot);
        }
        &[data-status="waiting"] {
          border-color: var(--hot);
          > header .status {
            color: var(--hot);
          }
        }
        .goal {
          color: var(--ink-2);
        }
        .log {
          margin: 0;
          padding: 0;
          list-style: none;
          max-height: 12lh;
          overflow-y: auto;

          li {
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            color: var(--ink-3);
            &::before {
              color: var(--ink-4);
            }
          }
          [data-kind="action"] {
            color: var(--ink);
            &::before {
              content: "λ ";
            }
          }
          [data-kind="result"]::before {
            content: "← ";
          }
          [data-kind="say"] {
            color: var(--ink-2);
            &::before {
              content: "“ ";
            }
          }
          [data-kind="message"] {
            color: var(--ink-2);
            &::before {
              content: "you: ";
            }
          }
          :is([data-kind="error"], [data-kind="rejected"]) {
            color: var(--hot);
            &::before {
              content: "! ";
            }
          }
          [data-kind="done"] {
            color: var(--ink);
            &::before {
              content: "✓ ";
            }
          }
        }
        .knobs {
          display: grid;
          gap: 2px;
        }
        .knob {
          display: grid;
          grid-template-columns: 10ch minmax(0, 1fr) auto;
          align-items: center;
          gap: var(--gap);
          color: var(--ink-3);
          b {
            font-weight: inherit;
          }
          &[data-on] {
            color: var(--ink);
            b {
              color: var(--hot);
            }
          }
          .scale {
            display: grid;
            grid-template-columns: auto 1fr auto;
            gap: var(--gap);
            align-items: center;
          }
          input[type="range"] {
            min-width: 0;
            accent-color: var(--hot);
          }
          .choice {
            display: flex;
            flex-wrap: wrap;
            gap: 2px;
          }
        }
        .focus {
          display: flex;
          flex-wrap: wrap;
          gap: 2px;
        }
        .message input {
          width: 100%;
          box-sizing: border-box;
        }
      }
      .chip {
        border-color: var(--hot);
        color: var(--hot);
      }
      .proposal {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        gap: 4px;
        padding: var(--gap);
        border: var(--hair) dashed var(--ink-4);

        &[data-status="pending"][data-needs-approval="true"] {
          border: var(--hair) solid var(--hot);
        }
        header {
          display: flex;
          flex-wrap: wrap;
          align-items: center;
          gap: var(--gap);
          .status {
            flex: 1;
            color: var(--ink-3);
          }
        }
        &[data-status="writing"] .status {
          color: var(--hot);
        }
        .effect {
          padding: 0 0.5ch;
          border: var(--hair) solid var(--ink-4);
          color: var(--ink-3);
          &:is([data-effect="shell"], [data-effect="net"]) {
            border-color: var(--hot);
            color: var(--hot);
          }
        }
        .scrub {
          display: flex;
          align-items: center;
          gap: 4px;
        }
        .code {
          color: var(--ink);
        }
        &[data-status="writing"] .code::after {
          content: "▍";
          color: var(--hot);
        }
        .error {
          color: var(--hot);
          white-space: pre-wrap;
        }
        .editor {
          field-sizing: content;
          min-height: 3lh;
          resize: vertical;
        }
        .actions {
          display: flex;
          gap: 4px;
          input {
            flex: 1;
            min-width: 0;
          }
        }
        .run {
          border-color: var(--hot);
          color: var(--hot);
        }
      }
      footer {
        display: flex;
        justify-content: center;
        align-items: center;
        height: var(--tray-height);
        border-top: var(--hair) solid var(--ink-5);
        color: var(--ink-3);
        font-size: var(--small-size);
        white-space: nowrap;

        > * {
          padding: 0 var(--gap);
          border: none;
          border-left: var(--hair) solid var(--ink-5);
          background: none;
          color: var(--ink-2);
          font-size: inherit;
          text-decoration: none;
        }
        > :first-child {
          border-left: none;
        }
        b {
          margin-left: 0.5ch;
          font-weight: inherit;
          color: var(--ink);
        }
        [data-offline] {
          color: var(--hot);
        }
        #notice {
          color: var(--hot);
          &:empty {
            display: none;
          }
        }
      }
      #key-dialog {
        width: min(48ch, 100% - 4 * var(--gap));
        padding: calc(2 * var(--gap));
        border: var(--hair) solid var(--ink-3);
        background: var(--bg);
        color: var(--ink);
        &::backdrop {
          background: rgb(0 0 0 / 0.7);
        }
        form {
          display: grid;
          gap: var(--gap);
        }
        h2 {
          margin: 0;
          font: inherit;
        }
        p {
          color: var(--ink-2);
        }
        input {
          -webkit-text-security: disc;
        }
        .actions {
          display: flex;
          justify-content: end;
          gap: var(--gap);
        }
      }
      @media (max-width: 800px) {
        body > div {
          grid-template-columns: 1fr;
          height: auto;
        }
        aside {
          border-right: none;
          border-bottom: var(--hair) solid var(--ink-5);
        }
        #panes {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div>
      <aside aria-label="environment">
        <h2>buffers</h2>
        <ul id="buffer-list"></ul>
        <p class="actions">
          <button id="new-terminal" type="button">+ terminal</button>
          <button id="new-notes" type="button">+ notes</button>
        </p>
        <h2>agents</h2>
        <ul id="agent-list"></ul>
        <h2>tools</h2>
        <ul id="tool-list"></ul>
      </aside>
      <main id="panes"></main>
    </div>
    <footer>
      <button id="mode-toggle" type="button" aria-pressed="false" aria-label="flight mode">mode<b>sim</b></button>
      <span id="connection">connecting…</span>
      <span id="notice" role="status"></span>
      <a href="workspace.html">workspace</a>
      <a href="./">story</a>
    </footer>
    <dialog id="key-dialog" aria-labelledby="key-title" closedby="closerequest">
      <form method="dialog" autocomplete="off">
        <h2 id="key-title">launch</h2>
        <p>Your Cerebras key goes to the kernel process on this machine and stays in its memory; the page does not keep it.</p>
        <input
          name="key"
          type="text"
          required
          autocomplete="off"
          spellcheck="false"
          data-1p-ignore
          data-lpignore="true"
          aria-label="Cerebras API key"
          autofocus
        />
        <p class="actions">
          <button type="button" command="close" commandfor="key-dialog">abort</button>
          <button value="launch">launch</button>
        </p>
      </form>
    </dialog>
    <script type="module" src="/src/environment-ui/main.ts"></script>
  </body>
</html>
